# Phase 1 skeleton reverse proxy. Real routing rules (rate limiting,
# TLS termination, security headers) are added in Phase 19.
events {}

http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://backend:8000/api/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://frontend:80/;
      proxy_set_header Host $host;
    }
  }
}
